name: Build wholesale site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install telethon pillow

      - name: Restore saved progress
        uses: actions/cache/restore@v4
        with:
          path: store
          key: store-${{ github.run_id }}
          restore-keys: |
            store-

      - name: Copy site files
        run: |
          mkdir -p public
          rsync -a --exclude '.git' --exclude '.github' --exclude 'public' --exclude 'store' --exclude 'scrape.py' --exclude 'settings.json' ./ public/

      - name: Process zips (time-boxed)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_ZIP_CHANNEL: ${{ secrets.TG_ZIP_CHANNEL }}
        run: timeout 16m python -u scrape.py

      - name: Save progress
        if: hashFiles('store/changed.flag') != ''
        uses: actions/cache/save@v4
        with:
          path: store
          key: store-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
