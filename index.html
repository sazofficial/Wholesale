<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wholesale</title>
<style>
  :root { --bg:#fff; --fg:#000; --line:#e5e5e5; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; border-bottom:1px solid var(--line); font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; padding:12px; }
  .card { border:1px solid var(--line); padding:8px; }
  .card img, .card video { width:100%; aspect-ratio:1; object-fit:cover; background:#f5f5f5; }
  .name { font-size:14px; margin:6px 0; }
  .price { font-weight:700; }
</style>
</head>
<body>
<header>Wholesale</header>
<div class="grid" id="grid"></div>
<script>
fetch('products.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const grid = document.getElementById('grid');
    data.products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      const m = p.media && p.media[0];
      if (m && m.type === 'image') {
        card.innerHTML += `<img src="${m.src}" loading="lazy">`;
      } else if (m && m.type === 'video') {
        card.innerHTML += `<video src="${m.src}" muted controls></video>`;
      }
      card.innerHTML += `<div class="name"></div><div class="price">₹${p.price}</div>`;
      card.querySelector('.name').textContent = p.name;
      grid.appendChild(card);
    });
  });
</script>
</body>
</html>
